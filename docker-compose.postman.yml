# Ambiente independente: nenhum volume/banco do compose de desenvolvimento.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taxflow_postman
      MYSQL_USER: taxflow
      MYSQL_PASSWORD: postman-local-only
      MYSQL_ROOT_PASSWORD: postman-root-local-only
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: taxflow-api
    build: ./backend
    ports:
      - '127.0.0.1:18000:8000'
    volumes:
      - ./backend:/app
      - vendor:/app/vendor
    environment:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: taxflow_postman
      DB_USERNAME: taxflow
      DB_PASSWORD: postman-local-only
      DB_URL: ''
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fs, 'http://localhost:8000/api/health']
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 30s
volumes:
  vendor:
